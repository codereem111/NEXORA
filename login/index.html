<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CPE Nexora</title>
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/animations.css">
  <link rel="icon" href="/assets/images/nexora-logo.svg" type="image/svg+xml">
  
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      animation: fadeIn 0.5s ease-out;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1.5rem;
      padding: 2.5rem;
      animation: slideInUp 0.5s ease-out;
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-logo {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .login-title {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #00f9ff, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .login-subtitle {
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.95rem;
    }

    .form-group input {
      margin-bottom: 0.5rem;
    }

    .login-button {
      width: 100%;
      margin-bottom: 1rem;
    }

    .login-footer {
      text-align: center;
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.875rem;
    }

    .login-footer a {
      color: var(--primary);
    }

    .login-divider {
      text-align: center;
      margin: 1.5rem 0;
      color: rgba(255, 255, 255, 0.3);
    }

    .forgot-password {
      text-align: center;
      margin-top: 1rem;
    }

    .forgot-password a {
      font-size: 0.875rem;
    }

    @media (max-width: 480px) {
      .login-box {
        padding: 1.5rem;
      }

      .login-title {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <div class="login-header">
        <img src="/assets/images/nexora-logo.svg" alt="CPE Nexora logo" class="app-logo">
        <h1 class="login-title" style="display: inline-block;">CPE Nexora</h1>
        <p class="login-subtitle">Sign in to your secure vault</p>
      </div>

      <form id="login-form">
        <!-- Email Field -->
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input 
            type="email" 
            class="form-control" 
            id="email" 
            placeholder="Enter your email"
            required
          >
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label class="form-label">Password</label>
          <input 
            type="password" 
            class="form-control" 
            id="password" 
            placeholder="Enter your password"
            required
          >
        </div>

        <!-- Remember Me -->
        <div class="form-check" style="margin-bottom: 1.5rem;">
          <input type="checkbox" class="form-check-input" id="remember" />
          <label class="form-check-label" for="remember">Remember me</label>
        </div>

        <!-- Login Button -->
        <button type="submit" class="btn btn-primary login-button">
          Sign In
        </button>
      </form>

      <!-- Forgot Password -->
      <div class="forgot-password">
        <a href="#" id="forgot-password-link">Forgot Password?</a>
      </div>

      <!-- Divider -->
      <div class="login-divider">─────────────────</div>

      <!-- Footer -->
      <div class="login-footer">
        Don't have an account? <br>
        <a href="/signup" style="color: var(--primary); font-weight: 600;">Create one here</a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script type="module">
    import AuthService from '/services/auth.js';
    import RouteGuard from '/services/guards.js';
    import { Toast, FormValidator } from '/assets/js/ui.js';

    const form = document.getElementById('login-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const forgotPasswordLink = document.getElementById('forgot-password-link');

    // Handle form submission
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      // Validate
      if (!FormValidator.validateEmail(email)) {
        Toast.error('Please enter a valid email');
        return;
      }

      if (!FormValidator.validateMinLength(password, 6)) {
        Toast.error('Password must be at least 6 characters');
        return;
      }

      // Show loading state
      const button = form.querySelector('button[type="submit"]');
      button.classList.add('btn-loading');
      button.disabled = true;

      try {
        // Attempt login
        const { session, error } = await AuthService.login(email, password);

        if (error) {
          Toast.error(error);
          alert(error);
          return;
        }

        Toast.success('Logged in successfully!');

        // Redirect to dashboard
        setTimeout(() => {
          window.location.href = RouteGuard.getPostLoginRedirect();
        }, 1000);
      } catch (error) {
        console.error('[Login Error]', error);
        Toast.error('Login failed');
      } finally {
        button.classList.remove('btn-loading');
        button.disabled = false;
      }
    });

    // Handle forgot password
    forgotPasswordLink.addEventListener('click', async (e) => {
      e.preventDefault();

      const email = prompt('Enter your email address:');
      if (!email) return;

      if (!FormValidator.validateEmail(email)) {
        Toast.error('Invalid email');
        return;
      }

      try {
        const { error } = await AuthService.resetPassword(email);
        if (error) {
          Toast.error(error);
          return;
        }

        Toast.success('Password reset email sent! Check your inbox.');
      } catch (error) {
        console.error('[Reset Error]', error);
        Toast.error('Failed to reset password');
      }
    });

    // Check if already logged in
    const session = await AuthService.getCurrentSession();
    if (session) {
      window.location.href = '/workspace';
    }
  </script>

  <script type="module" src="/assets/js/main.js"></script>
</body>
</html>
